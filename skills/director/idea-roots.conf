# Roots dbi scans for big ideas, one path or glob per line (stalled-big-ideas.md section 3).
# Installed to $DIRECTOR_STATE/idea-roots.conf only when that file is absent; edit the installed copy.
# This default names no roots, because a root is a path on one machine. Add yours, for example:
#   ~/work/myrepo/_kos/ideas/*.md
# Until then dbi stops with exit 2 and says no root is named, rather than report an empty scan.
