# Publish a director-mcp prerelease for each push to main that changes the shim
# (sim/design/shim-release-and-pinned-install.md, R3). Four binaries built by
# scripts/build-director-mcp from the pushed commit, the seat wrapper taken from
# the same commit, a checksums.txt, and one
# build-provenance attestation over all of them as attestations.sigstore.json.
# No signing key is held here: the attestation is keyless, from the run's OIDC
# identity. macOS signing and notarization are not part of this release.
name: Release director-mcp

on:
  push:
    branches: [main]
    paths:
      - 'cmd/director-mcp/**'
      - 'scripts/build-director-mcp'
      - 'scripts/package-director-mcp-release'
      - 'scripts/publish-director-mcp-release'
      - 'probe/nats-phase-0/director-mcp-seat'
      - '.github/workflows/release-director-mcp.yml'

permissions:
  contents: read

concurrency:
  group: release-director-mcp
  cancel-in-progress: false

jobs:
  build:
    name: Build and package
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.pkg.outputs.tag }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'cmd/director-mcp/go.mod'
          cache-dependency-path: cmd/director-mcp/go.sum

      - name: Package
        id: pkg
        run: |
          set -euo pipefail
          scripts/package-director-mcp-release --git-dir .git --sha "$GITHUB_SHA" --out dist | tee pkg.out
          tail -n 1 pkg.out >> "$GITHUB_OUTPUT"

      - name: The linux/amd64 binary reports this commit
        run: |
          set -euo pipefail
          chmod +x dist/director-mcp-linux-amd64
          line="$(dist/director-mcp-linux-amd64 --version)"
          echo "$line"
          [[ "$line" == *" rev $GITHUB_SHA "* ]]

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  release:
    name: Attest and publish
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      # Creates the tag and the release.
      contents: write
      # Keyless attestation.
      id-token: write
      attestations: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Attest the binaries and checksums
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: 'dist/*'

      - name: Publish the prerelease, or finish one a failed run left short
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build.outputs.tag }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$BUNDLE" dist/attestations.sigstore.json
          scripts/publish-director-mcp-release --tag "$TAG" --sha "$GITHUB_SHA" --dist dist --repo "$GITHUB_REPOSITORY"
