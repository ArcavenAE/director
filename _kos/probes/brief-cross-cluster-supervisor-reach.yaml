id: brief-cross-cluster-supervisor-reach
type: brief
confidence: frontier
title: "Probe: confirm that the mokuzai-side grant is the cause of mokuzai to kinu supervisor failures, and test what keeps reach after a grant change"
content: |
  ## Evidence so far (read-only, 2026-09-28)

  - Mokuzai side (ops-supervisor-g5-0): mokuzai's nats-server logs a
    Publish Violation on global.kinu.supervisor.inbox at 13:18:36Z and
    13:20:02Z (the two failed sends) and at 14:32:30Z (a PROBE publish).
    Its leaf users hold two global publish grants, global.director.inbox
    and $JS.global.API.>, and none for any global.<cluster>.supervisor.inbox.
    The leaf is up; a control send to global://director worked.
  - Kinu side (arcaven-research-supervisor-g5-0): the hub's grant for the
    mokuzai leaf on global.kinu.supervisor.inbox arrived by a reload
    (2026-09-27 16:22Z) after that leaf connected (2026-09-26 06:08Z).
    Under finding-009 an open leaf keeps its old grant, so this may be a
    second layer behind the first.

  The mokuzai-side grant change is marvel#403 (merged as b1f4953, released
  in alpha-20260928-201034-b1f4953): a team holding a role named exactly
  "supervisor" gains publish on global.*.supervisor.inbox when a daemon
  running that build re-renders its broker authorization.

  ## Approach

  1. Done, read-only: both arms above. Grants reported by subject name
     only.
  2. Trigger: mokuzai runs a b1f4953 build and has re-rendered its broker
     authorization. First, read-only, confirm the supervisor team's broker
     user now holds publish on global.*.supervisor.inbox (by subject name
     only). Then, before any leaf reconnect, one PROBE publish (body says
     ignore) to global.kinu.supervisor.inbox from a seat on a team with a
     role named exactly "supervisor" (marvel#403's scope; any other sender
     still meets the Publish Violation and says nothing about the hub),
     with a control to global.mokuzai.supervisor.inbox. Read GLOBAL_TO_kinu's
     message count on the hub (monitoring jsz) and mokuzai's log for a
     Publish Violation.
  3. Only if step 2 fails with no Publish Violation on mokuzai, and only
     with operator approval: reconnect the mokuzai leaf (marvel bus leaf
     disconnect then connect on mokuzai, or the owner's equivalent), then
     repeat the PROBE.
  4. Scratch hub (finding-009 question A): on a throwaway hub and leaf, add
     a publish grant by reload and test an existing leaf and a new one.
     Confirm which nats-server behavior this is and whether any reload
     option refreshes an open leaf's permissions.

  ## Outcomes of step 2

  - Acked before any reconnect (GLOBAL_TO_kinu count +1): the two-layer
    hypothesis is FALSIFIED; the hub grant is live and the mokuzai grant
    was the only block.
  - No Publish Violation on mokuzai and not acked, then acked after the
    approved reconnect in step 3: the two-layer hypothesis is SUPPORTED.
  - Publish Violation still present on mokuzai: a VOID run. The grant is
    not in effect for that sender (wrong build, no re-render, or a sender
    outside a "supervisor" team); fix that and rerun step 2.

  ## Excluded scope

  No edit, restart or credential change on the running hub or any leaf
  without operator approval. No configuration values, seeds or tokens
  quoted; grants are reported by subject name or as booleans.
  leaf-kinu.conf is not read.

  ## Harvest

  Falsified: a new finding naming the mokuzai-side grant as the only cause
  and the hub grant as live; question A closes. Supported: that finding
  plus an addendum to finding-009 (second instance, mokuzai leaf,
  2026-09-27 reload); question A closes. Void: no harvest; rerun. Step 4
  and question B feed a runbook or code change. If step 3 also fails: a
  new finding naming what remains, and question A stays open.
