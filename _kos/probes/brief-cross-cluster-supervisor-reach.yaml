id: brief-cross-cluster-supervisor-reach
type: brief
confidence: frontier
title: "Probe: confirm that the mokuzai-side grant is the cause of mokuzai to kinu supervisor failures, and test what keeps reach after a grant change"
content: |
  ## Evidence so far (read-only, 2026-09-28)

  - Mokuzai side (ops-supervisor-g5-0): mokuzai's nats-server logs a
    Publish Violation on global.kinu.supervisor.inbox at 13:18:36Z and
    13:20:02Z (the two failed sends) and at 14:32:30Z (a PROBE publish).
    Its leaf users hold two global publish grants, global.director.inbox
    and $JS.global.API.>, and none for any global.<cluster>.supervisor.inbox.
    The leaf is up; a control send to global://director worked.
  - Kinu side (arcaven-research-supervisor-g5-0): the hub's grant for the
    mokuzai leaf on global.kinu.supervisor.inbox arrived by a reload
    (2026-09-27 16:22Z) after that leaf connected (2026-09-26 06:08Z).
    Under finding-009 an open leaf keeps its old grant, so this may be a
    second layer behind the first.

  The fix is operator-owned: a grant change in mokuzai's authorization,
  which marvel renders. It is not approved, and nothing has been changed.

  ## Approach

  1. Done, read-only: both arms above. Grants reported by subject name
     only.
  2. After the operator makes the mokuzai grant change: one PROBE publish
     (body says ignore) from mokuzai to global.kinu.supervisor.inbox, with
     a control to global.mokuzai.supervisor.inbox, before any leaf
     reconnect, and a read-only check of GLOBAL_TO_kinu's message count on
     the hub (monitoring jsz) and of mokuzai's log for a Publish Violation.
  3. Only if step 2 fails with no Publish Violation on mokuzai, and only
     with operator approval: reconnect
     the mokuzai leaf (marvel bus leaf disconnect then connect on mokuzai,
     or the owner's equivalent), then repeat the PROBE. A pass here
     confirms the kinu reload timing as a second layer (finding-009).
  4. Scratch hub (finding-009 question A): on a throwaway hub and leaf, add
     a publish grant by reload and test an existing leaf and a new one.
     Confirm which nats-server behavior this is and whether any reload
     option refreshes an open leaf's permissions.

  ## Excluded scope

  No edit, restart or credential change on the running hub or any leaf
  without operator approval. No configuration values, seeds or tokens
  quoted; grants are reported by subject name or as booleans.
  leaf-kinu.conf is not read.

  ## Harvest

  If step 2 passes: a new finding naming the mokuzai-side grant as the
  cause and the hub grant as live, and question A closes. If only step 3
  passes: that finding plus an addendum to finding-009 (second instance,
  mokuzai leaf, 2026-09-27 reload), and question A closes. Step 4 and question B feed a runbook or code change. If neither
  passes: a new finding naming what remains, and question A stays open.
