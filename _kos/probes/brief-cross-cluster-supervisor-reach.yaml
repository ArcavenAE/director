brief:
  hypothesis: "Two grants stand in series. The proximate block is mokuzai's local authorization: its leaf users may publish globally only to global.director.inbox and $JS.global.API.>, so global.kinu.supervisor.inbox is a Publish Violation on mokuzai. Behind it, the hub's grant for the mokuzai leaf to publish global.kinu.supervisor.inbox was added by reload after that leaf connected, which finding-009 says an open leaf does not see. Reach returns only when mokuzai grants the subject and the mokuzai leaf reconnects to the hub."
  excluded_scope: "Edits, restarts or credential changes on the running hub or leaves without operator approval; quoting any configuration value or credential; reading leaf-kinu.conf."
  success_signal: "With mokuzai's grant applied and before any leaf reconnect, one PROBE publish to global.kinu.supervisor.inbox either is acked (GLOBAL_TO_kinu count +1, the hub layer is live) or fails with no Publish Violation on mokuzai (the hub layer blocks). If it fails, the same PROBE after an approved leaf reconnect is acked."
  timebox: "Step 2 within one working session of the operator's grant change; step 3 only if step 2 fails; step 4 within one working session."
  predicted_confidence: 0.7
