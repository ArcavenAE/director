brief:
  hypothesis: "The proximate cause of the mokuzai to kinu supervisor failure is mokuzai's own authorization: its leaf users hold no publish grant for global.kinu.supervisor.inbox, and mokuzai's server logs a Publish Violation on each send. Adding that grant on mokuzai restores reach. The hub's grant for the mokuzai leaf arrived by a reload after the leaf connected (finding-009), so a leaf reconnect may also be needed; that second layer is untested."
  excluded_scope: "Edits, restarts or credential changes on the running hub or leaves without operator approval; quoting any configuration value or credential; reading leaf-kinu.conf."
  success_signal: "After the operator's grant change on mokuzai, one PROBE publish from mokuzai to global.kinu.supervisor.inbox is acked, GLOBAL_TO_kinu's message count rises by one, and mokuzai logs no Publish Violation for it; the control to global.mokuzai.supervisor.inbox succeeds."
  timebox: "Step 2 within one working session of the operator's grant change; step 3 only if step 2 fails; step 4 within one working session."
  predicted_confidence: 0.6
