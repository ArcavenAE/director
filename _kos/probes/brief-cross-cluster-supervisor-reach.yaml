id: brief-cross-cluster-supervisor-reach
type: brief
confidence: frontier
title: "Probe: confirm the stale-grant cause of mokuzai to kinu supervisor failures, and test what keeps reach after a grant change"
content: |
  ## Approach

  1. Far side, read-only (mokuzai arm, ops-supervisor-g5-0): the leaf
     connection state and start time; the leaf credential's publish grants by
     name only; one PROBE publish (body says ignore) to
     global.kinu.supervisor.inbox and one to global.mokuzai.supervisor.inbox
     as the control. Verbatim results.
  2. Confirmation, interventional and operator-approved only: reconnect the
     mokuzai leaf (marvel bus leaf disconnect then connect on mokuzai, or the
     owner's equivalent), then repeat the one PROBE publish to
     global.kinu.supervisor.inbox and check GLOBAL_TO_kinu's message count on
     the hub (monitoring jsz, read-only).
  3. Scratch hub (finding-009 question A): on a throwaway hub and leaf, add a
     publish grant by reload and test an existing leaf and a new one.
     Confirm which nats-server behavior this is and whether any reload option
     refreshes an open leaf's permissions.

  ## Excluded scope

  No edit, restart or credential change on the running hub or any leaf
  without operator approval. No values, seeds or tokens printed; grants are
  reported by subject name or as booleans. leaf-kinu.conf is not read.

  ## Harvest

  If step 2 restores reach: an addendum to finding-009 (second instance,
  mokuzai leaf, 2026-09-27 reload), and question A closes. Steps 3 and B
  feed a runbook or code change on the director side. If step 2 does not
  restore reach: a new finding naming the actual cause, and this question
  stays open on A.
