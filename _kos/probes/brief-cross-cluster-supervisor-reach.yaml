  excluded_scope: "Edits, restarts or credential changes on the running hub or leaves without operator approval; printing any credential value; reading leaf-kinu.conf."
  success_signal: "After an approved reconnect of the mokuzai leaf, one PROBE publish from mokuzai to global.kinu.supervisor.inbox is acked and GLOBAL_TO_kinu's message count rises by one; before it, the same publish fails with no responders while the control to global.mokuzai.supervisor.inbox succeeds."
