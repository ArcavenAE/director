brief:
  hypothesis: "A map built only from data the fleet already writes (marvel sessions per cluster, presence, harness status, route ledgers, bd events) can supply every proposed field except duty cycle, once supervisors share one route-ledger schema that records closure."
  excluded_scope: "Gating any dispatch, merge or release on a map field; ranking seats; reading message bodies or transcripts for content; building stagekeeper."
