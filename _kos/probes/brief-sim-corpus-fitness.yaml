brief:
  hypothesis: "About a quarter of the register's Earned-by evidence resolves only into gitignored notes. A tracked-only StRS will therefore have untraceable sections wherever those entries cluster, until a public evidence ledger exists."
  excluded_scope: "Quoting, summarizing or publishing anything from sim/notes/; editing the register or the audit; running the reverse brief itself (that is 5e52j)."
  success_signal: "A finding with the StRS section map, the 20-chain sample (how many resolve publicly), the class-versus-theme diff, the clean-rewrite list, and a go or no-go for 5e52j. The hypothesis is disconfirmed if no more than 2 of the 20 sampled chains depend only on notes, and no StRS section the PRD needs is empty."
  timebox: "One working session for steps 1 to 3; the finding in the next."
  predicted_confidence: 0.6
