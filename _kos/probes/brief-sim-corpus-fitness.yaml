brief:
  hypothesis: "The tracked corpus cannot yet stand alone as reverse-brief input: most register entries earn their place through evidence in the gitignored notes, so a director StRS drafted from tracked sources will have empty or untraceable sections until a public evidence ledger exists."
  excluded_scope: "Quoting, summarizing or publishing anything from sim/notes/; editing the register or the audit; running the reverse brief itself (that is 5e52j)."
  success_signal: "A finding with the StRS section map, the 20-chain sample (how many resolve publicly), the class-versus-theme diff, the clean-rewrite list, and a go or no-go for 5e52j. The hypothesis is disconfirmed if most sampled chains resolve from tracked sources and no StRS section 5e52j needs is empty."
  timebox: "One working session for steps 1 to 3; the finding in the next."
  predicted_confidence: 0.7
