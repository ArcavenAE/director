id: question-global-supervisor-delivery-scope
type: question
confidence: frontier
title: "Should the global tier deliver a cluster's supervisor traffic by team, or filter by FOR before delivery, so a supervisor stops reading every other supervisor's mail?"
content: |
  `global://<cluster>/supervisor` fans out to every supervisor seat on the
  cluster (finding-006), and the FOR line is only a convention the receiver
  reads after delivery. Measured twice during one pause on one cluster
  (finding-023): one seat drained about 285 messages and 6 were for its
  team; another held 300, of which 273 (91%) were for one other team's
  supervisor or reviewer, and a drain at max 50 came to 552 KB over six
  batches.

  Options named, none chosen:

  A. Team-addressed global subjects (`global://<cluster>/<team>/supervisor`),
     an addressing change at the broker.
  B. The shim drops or folds an envelope whose FOR names another team before
     it reaches the model. A filter, not a boundary.

  Either must keep a real broadcast reaching every supervisor.
edges:
  - target: finding-006-global-tier-has-no-per-agent-address
    type: derives
    note: "the fan-out mechanism this question prices"
  - target: finding-023-every-supervisor-pays-to-read-every-other-supervisors-global-traffic
    type: derives
    note: "the two measurements of the cost"
