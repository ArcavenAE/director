id: question-idle-seat-receive-latency
type: question
confidence: frontier
title: "How does mail reach an idle seat that nothing wakes, and how does the sender learn it has not?"
tags: [director, delivery, cue]
content: |
  Opened 2026-10-07 to place finding-013, which no node cited.

  `wait_for_message` is a poll, and a Claude seat that has finished its turn
  makes no calls until a user turn or a scheduled prompt arrives. On one idle
  supervisor seat without the channel cue, three messages waited 4h18m, about
  21h and about 15h between 2026-10-01 and 2026-10-02. Nothing was lost: all
  three were waiting, in order, when the seat drained. The delay was set by the
  next unrelated wake (a timer once, the operator typing twice), not by the bus
  (finding-013).

  The P1 channel cue (#166, built in #171 and #175) exists for this case, but it
  is opt-in at cast time through `DIRECTOR_CUE=1`. On 2026-10-02, 0 of 18 running
  shims on that host set it (finding-013, checked per process). Whether that is
  still the count is not established here.

  The sender side is the second half. Each send returned "accepted for
  delivery", and R-08 already says accepted is not delivered or read, yet
  "routed" was read as "in hand" (finding-013).

  ## The question

  A. Should the cue be on by default for supervisor seats, or for every seat
     that dispatches work and waits on a reply?
  B. What tells the sender that a message is still unread: the cue design's
     `cue.unanswered` receipt surfaced to the sender, a per-recipient "oldest
     unread" age from `inbox_summary`, or something else? finding-013 names
     both as candidates; neither is built.
  C. Until A is settled, is a supervisor's own scheduled check for when
     dispatched work is due the practice, as finding-013 recommends, and where
     is it written down?

  ## Not established

  None of A to C is decided. The measurement is one seat over one day; the
  mechanism is the one #166 already names.
