id: question-director-ask-life-after-the-work
type: question
confidence: frontier
title: "Where do operator asks stop now that the answer and close records exist, and is a multi-part ask one item or several?"
tags: [director, asks, lifecycle, registers]
content: |
  Placed 2026-11-20 from finding-director-s540. Filed in frontier; no
  design is proposed, and the operator rules on what comes next.

  ## The question

  The oldest open asks stopped after the work. Before 2026-11-10 the ask
  register recorded no close event and the relay log no answer kind (the
  code for both merged on 2026-11-09), so done work could not be recorded
  as done. After 2026-11-10, 199 of 293
  asks closed before the triage, at a median of half an hour. Five things
  remain open:

  - Of the asks that still stay open after 2026-11-10, the commonest stop
    is a Desk ruling the operator has not yet made (8 of 24 sampled). Is
    that a queue the operator wants to see as a queue, or a stop that
    belongs to the ask?
  - When the operator rules on the Desk, what carries the ruling back to
    the ask? Some rulings were made and never relayed; a re-sync on
    2026-11-20 found seven made on 2026-11-13.
  - When the operator answers an earlier question, should that reply open
    a new ask, or attach to the one it answers? 174 of 399 open asks are
    reply-shaped.
  - When most of an ask is done and one part is open, what is the ask's
    state, and who owns the open part? 24 of 86 sampled open asks are such
    residual parts.
  - How long do accepted asks wait unread on idle seats, and how many move
    only when a supervisor rings? One supervisor's log for 2026-11-19
    shows about 15 such rings in four hours, with waits of 15 to 50 minutes.

  ## How it would be answered

  Re-run the trace in finding-director-s540 over asks received after
  2026-11-20, once enough have aged. Read the Reply Shelf and the bus
  answers as well as the files. Compare the stop points with the two
  periods measured in the finding.
