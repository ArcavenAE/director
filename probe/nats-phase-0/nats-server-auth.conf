# director#4 activation config: the Phase 0 broker WITH authorization.
#
# This binds :4222 and the live JetStream store from nats-server.conf, then adds
# the authorization block. Launch it ONLY at a coordinated fleet relaunch, where
# the broker is stopped and every session is restarted presenting a credential
# at once. It is deliberately NOT the default restart path: nats-server.conf
# stays anonymous so a routine restart does not silently require auth and drop a
# live fleet.
#
# Relaunch (all at once, not a hot reload):
#   DIRECTOR_ADMIN_PASS=... DIRECTOR_OPS_PASS=... \
#     nats-server -c probe/nats-phase-0/nats-server-auth.conf
# and each session's shim presents DIRECTOR_NATS_USER=ops DIRECTOR_NATS_PASS=...
# (the builder's shim contract in director-mcp/bus.go connect()).
#
# To prove the block without touching :4222, run verify-auth.sh (it stands up a
# throwaway broker on :4223 with its own store).

include "nats-server.conf"
include "authorization.conf"
