# director NATS Phase 0 probe broker. Localhost only, JetStream on.
# Reversible: kill the process, rm -rf "$DIRECTOR_PHASE0_HOME" (default
# ~/.director/nats). No launchd yet.
#
# store_dir is the value of DIRECTOR_PHASE0_STORE, which start.sh derives from
# DIRECTOR_PHASE0_HOME (default ~/.director/nats) as its /store subdir, so a
# second host places its store under its own home with no edit here. Launch
# through start.sh; it sets and exports the variable.
#
# The reference is an unquoted whole value on purpose. NATS substitutes an env
# var only when the value is exactly $VAR unquoted; it then errors loudly on an
# unset one, so a bare `nats-server -c nats-server.conf` refuses to start rather
# than write to a stray path. A quoted "$VAR/store" is left literal (never
# substituted), and "$VAR/store" unquoted is read as one variable name; this
# form avoids both traps. The global tier means the same by DIRECTOR_GLOBAL_HOME
# (probe/nats-global-tier/hub).
#
# host stays pinned to loopback: Phase 0 is localhost only by design, and
# cross-host reach is the global tier's leaf-node job, not this broker binding
# a routable address.
host: "127.0.0.1"
port: 4222
http_port: 8222
server_name: director-phase0
jetstream {
  store_dir: $DIRECTOR_PHASE0_STORE
  max_memory_store: 268435456
  max_file_store: 1073741824
}
