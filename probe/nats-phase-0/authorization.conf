# director#4: the authorization block for the Phase 0 bus (R-77, R-82).
#
# The probe broker shipped with no authorization, so every local process held
# publish and subscribe on ">": a launcher-assigned name was a claim anyone
# could make, with nothing for a verifier to check it against. This block binds
# a credential to the subjects it may use, so the bus (not the honor system)
# enforces the binding. A name on an inbound message stays display text; the
# credential is the only authority (R-82).
#
# This file is meant to be included, not launched directly. See
# nats-server-auth.conf (activation) and verify-auth.sh (isolated :4223 proof).
#
# Passwords come from the environment on purpose, so no secret is committed to a
# public repo. The operator sets them at the coordinated relaunch; verify-auth.sh
# sets throwaway values for its :4223 run. An unset variable makes the server
# refuse to start, which is the safe direction.
#
# Phase 0 shape and its two known residuals (both close under the marvel-owned
# evolution, R-85 and R-86, not here):
#   1. One credential per team, not per session. Every ops session shares the
#      ops credential, so the team subtree is authenticated as a whole but not
#      partitioned per session. Per-session minting is R-85 (marvel injects a
#      per-session credential at spawn the way MARVEL_HEARTBEAT_TOKEN rides).
#   2. JetStream is account-scoped. The permissions below confine the ops
#      credential on the core agent.aae-orc.ops.> subtree, but AGENT_INBOX is
#      one shared stream, and $JS.API access is per-account, so a determined ops
#      holder could still create a consumer on that shared stream filtered to
#      another team. Real per-team JetStream isolation is per-team accounts or
#      per-team streams, which belongs to the two-tier local plus global design
#      (R-86). The defect this closes is the unauthenticated open ">", not the
#      account-shared JetStream API.

authorization {
  users: [
    # Operator and setup identity. Bootstraps the streams and the presence KV,
    # and is the break-glass. This is NOT an agent credential and is never
    # handed to a session; a spawned agent gets a scoped team credential only.
    {
      user: director_admin
      password: $DIRECTOR_ADMIN_PASS
      permissions {
        publish   { allow: [ ">" ] }
        subscribe { allow: [ ">" ] }
      }
    }

    # The ops team credential. Confined to the ops team subtree plus the
    # JetStream and KV plumbing the shim needs. It cannot publish or subscribe
    # in another team's agent.aae-orc.<team>.> subtree, which is the binding the
    # ticket asks for. To add a team, copy this user, swap "ops" for the new
    # team in the two agent.aae-orc.ops.> lines, and give it its own password
    # variable; the subtree confinement then holds for it too.
    {
      user: ops
      password: $DIRECTOR_OPS_PASS
      permissions {
        publish {
          allow: [
            "agent.aae-orc.ops.>"      # ops inboxes, role inboxes, team broadcast
            "agent.audit"              # append to the shared audit stream
            "$JS.API.>"                # JetStream API (durable consumer, KV ops)
            "$JS.ACK.>"                # ack pulled messages
            "$KV.AGENT_STATE.>"        # write presence
            "_INBOX.>"                 # request/reply return subjects
          ]
        }
        subscribe {
          allow: [
            "agent.aae-orc.ops.>"      # own inbox, role inboxes, team broadcast
            "agent.aae-orc.broadcast"  # receive workspace-wide broadcasts
            "$KV.AGENT_STATE.>"        # read/watch presence
            "_INBOX.>"                 # replies (JS acks, KV gets)
          ]
        }
      }
    }
  ]
}
