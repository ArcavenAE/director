# director global bus tier (R-86), interim placement on kinu (operator ruling 2026-09-14).
# Second NATS on this host: the phase-0 local broker stays on 127.0.0.1:4222.
# Client 4242 and leaf 7442 bind the LAN interface; monitoring stays loopback.
# Transport TLS is deferred to the cloud phase; principal authorization (R-77) is not.
server_name: global-hub
listen: 0.0.0.0:4242
http: 127.0.0.1:8242
jetstream {
  store_dir: "$DIRECTOR_GLOBAL_HOME/store"
  domain: global
  max_memory_store: 268435456
  max_file_store: 2147483648
}
leafnodes {
  listen: 0.0.0.0:7442
  # Leaves authenticate as users of the FLEET account below, so the user's
  # publish list is what the leaf may send into the hub and its subscribe
  # list is what the hub forwards down to it.
}
accounts {
  FLEET {
    jetstream: enabled
    users: [
      # Provisioning and break-glass. Never handed to a session or a leaf.
      { nkey: UDCZZFGOMCOCKPTI7TQLYEARATUFACJGQYO2KA4BDHOJOIYBBDLCNZVD }

      # The director seat connecting directly (before its local broker leafs up).
      { nkey: UANZJCZECBGMSW7HDBRYTVNYOZFUK6CVRXV4SHAQ3ZYCQ5IXCTS2R4YD
        permissions {
          publish   { allow: [ "global.*.supervisor.inbox", "global.director.>",
                               "$JS.API.>", "$JS.ACK.>", "$KV.GLOBAL_PRESENCE.>", "_INBOX.>" ] }
          subscribe { allow: [ "global.director.>", "$KV.GLOBAL_PRESENCE.>", "_INBOX.>" ] }
        } }

      # Leaf link from the kinu local broker (the director's host).
      { nkey: UCEE32RDWATARAFTNKOCBMICSRWKVRDMLKEB4SPYLN54PCT6IOXR2O7I
        permissions {
          publish   { allow: [ "global.*.supervisor.inbox", "global.director.>",
                               "$JS.global.API.CONSUMER.CREATE.GLOBAL_TO_DIRECTOR.>",
                               "$JS.global.API.CONSUMER.DURABLE.CREATE.GLOBAL_TO_DIRECTOR.>",
                               "$JS.global.API.CONSUMER.INFO.GLOBAL_TO_DIRECTOR.>",
                               "$JS.global.API.CONSUMER.MSG.NEXT.GLOBAL_TO_DIRECTOR.>",
                               "$JS.global.API.CONSUMER.DELETE.GLOBAL_TO_DIRECTOR.>",
                               "$JS.global.API.STREAM.INFO.GLOBAL_TO_DIRECTOR",
                               "$JS.global.API.INFO",
                               "$JS.global.API.$KV.GLOBAL_PRESENCE.>",
                               "$JS.global.API.STREAM.INFO.KV_GLOBAL_PRESENCE",
                               "$JS.global.API.DIRECT.GET.KV_GLOBAL_PRESENCE.>",
                               "$JS.global.API.STREAM.MSG.GET.KV_GLOBAL_PRESENCE",
                               "$JS.global.API.CONSUMER.CREATE.KV_GLOBAL_PRESENCE.>",
                               "$JS.global.API.CONSUMER.INFO.KV_GLOBAL_PRESENCE.>",
                               "$JS.global.API.CONSUMER.DELETE.KV_GLOBAL_PRESENCE.>",
                               "$JS.ACK.>" ] }
          subscribe { allow: [ "global.director.>", "_INBOX.>" ] }
        } }

      # Leaf link from the mokuzai local broker (skippy's cluster).
      { nkey: UBJWNLSNWG7NDZ5KICYHUIUXCHIL5GZRWIFMTETW3TBA7CCFCNYM5STF
        permissions {
          publish   { allow: [ "global.director.inbox", "global.mokuzai.>",
                               "$JS.global.API.CONSUMER.CREATE.GLOBAL_TO_mokuzai.>",
                               "$JS.global.API.CONSUMER.DURABLE.CREATE.GLOBAL_TO_mokuzai.>",
                               "$JS.global.API.CONSUMER.INFO.GLOBAL_TO_mokuzai.>",
                               "$JS.global.API.CONSUMER.MSG.NEXT.GLOBAL_TO_mokuzai.>",
                               "$JS.global.API.CONSUMER.DELETE.GLOBAL_TO_mokuzai.>",
                               "$JS.global.API.STREAM.INFO.GLOBAL_TO_mokuzai",
                               "$JS.global.API.INFO",
                               "$JS.global.API.$KV.GLOBAL_PRESENCE.>",
                               "$JS.global.API.STREAM.INFO.KV_GLOBAL_PRESENCE",
                               "$JS.global.API.DIRECT.GET.KV_GLOBAL_PRESENCE.>",
                               "$JS.global.API.STREAM.MSG.GET.KV_GLOBAL_PRESENCE",
                               "$JS.global.API.CONSUMER.CREATE.KV_GLOBAL_PRESENCE.>",
                               "$JS.global.API.CONSUMER.INFO.KV_GLOBAL_PRESENCE.>",
                               "$JS.global.API.CONSUMER.DELETE.KV_GLOBAL_PRESENCE.>",
                               "$JS.ACK.>" ] }
          subscribe { allow: [ "global.mokuzai.>", "_INBOX.>" ] }
        } }
    ]
  }
}
