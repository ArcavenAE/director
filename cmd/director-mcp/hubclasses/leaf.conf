# leaf: one cluster's link to the hub. Parameter: cluster.
{ nkey: {{key}}
  permissions {
    publish   { allow: [ "global.director.inbox", "global.{{cluster}}.>",
                         "$JS.global.API.CONSUMER.CREATE.GLOBAL_TO_{{cluster}}.>",
                         "$JS.global.API.CONSUMER.DURABLE.CREATE.GLOBAL_TO_{{cluster}}.>",
                         "$JS.global.API.CONSUMER.INFO.GLOBAL_TO_{{cluster}}.>",
                         "$JS.global.API.CONSUMER.MSG.NEXT.GLOBAL_TO_{{cluster}}.>",
                         "$JS.global.API.CONSUMER.DELETE.GLOBAL_TO_{{cluster}}.>",
                         "$JS.global.API.STREAM.INFO.GLOBAL_TO_{{cluster}}",
                         "$JS.global.API.STREAM.MSG.DELETE.GLOBAL_TO_{{cluster}}",
                         "$JS.global.API.INFO",
                         "$JS.global.API.$KV.GLOBAL_PRESENCE.>",
                         "$JS.global.API.STREAM.INFO.KV_GLOBAL_PRESENCE",
                         "$JS.global.API.DIRECT.GET.KV_GLOBAL_PRESENCE.>",
                         "$JS.global.API.STREAM.MSG.GET.KV_GLOBAL_PRESENCE",
                         "$JS.global.API.CONSUMER.CREATE.KV_GLOBAL_PRESENCE.>",
                         "$JS.global.API.CONSUMER.INFO.KV_GLOBAL_PRESENCE.>",
                         "$JS.global.API.CONSUMER.DELETE.KV_GLOBAL_PRESENCE.>",
                         "$JS.ACK.>" ] }
    subscribe { allow: [ "global.{{cluster}}.>", "_INBOX.>" ] }
  } }
