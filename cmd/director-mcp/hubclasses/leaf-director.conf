# leaf-director: a leafnode credential, the leaf of the cluster whose broker also carries the
# director seat (one per deployment): the leaf grant plus the director-side grants of the
# design's grant table. JetStream grants are spelled $JS.<domain>.API as for leaf, never $JS.API.
# Parameters: cluster; domain (default global).
{ nkey: {{key}}
  permissions {
    publish   { allow: [ "global.director.inbox", "global.*.supervisor.inbox", "global.director.>", "global.{{cluster}}.>",
                         "$JS.{{domain}}.API.CONSUMER.CREATE.GLOBAL_TO_{{cluster}}.>",
                         "$JS.{{domain}}.API.CONSUMER.DURABLE.CREATE.GLOBAL_TO_{{cluster}}.>",
                         "$JS.{{domain}}.API.CONSUMER.INFO.GLOBAL_TO_{{cluster}}.>",
                         "$JS.{{domain}}.API.CONSUMER.MSG.NEXT.GLOBAL_TO_{{cluster}}.>",
                         "$JS.{{domain}}.API.CONSUMER.DELETE.GLOBAL_TO_{{cluster}}.>",
                         "$JS.{{domain}}.API.STREAM.INFO.GLOBAL_TO_{{cluster}}",
                         "$JS.{{domain}}.API.STREAM.MSG.DELETE.GLOBAL_TO_{{cluster}}",
                         "$JS.{{domain}}.API.CONSUMER.CREATE.GLOBAL_TO_DIRECTOR.>",
                         "$JS.{{domain}}.API.CONSUMER.DURABLE.CREATE.GLOBAL_TO_DIRECTOR.>",
                         "$JS.{{domain}}.API.CONSUMER.INFO.GLOBAL_TO_DIRECTOR.>",
                         "$JS.{{domain}}.API.CONSUMER.MSG.NEXT.GLOBAL_TO_DIRECTOR.>",
                         "$JS.{{domain}}.API.CONSUMER.DELETE.GLOBAL_TO_DIRECTOR.>",
                         "$JS.{{domain}}.API.STREAM.INFO.GLOBAL_TO_DIRECTOR",
                         "$JS.{{domain}}.API.STREAM.MSG.DELETE.GLOBAL_TO_DIRECTOR",
                         "$JS.{{domain}}.API.INFO",
                         "$JS.{{domain}}.API.$KV.GLOBAL_PRESENCE.>",
                         "$JS.{{domain}}.API.STREAM.INFO.KV_GLOBAL_PRESENCE",
                         "$JS.{{domain}}.API.DIRECT.GET.KV_GLOBAL_PRESENCE.>",
                         "$JS.{{domain}}.API.STREAM.MSG.GET.KV_GLOBAL_PRESENCE",
                         "$JS.{{domain}}.API.CONSUMER.CREATE.KV_GLOBAL_PRESENCE.>",
                         "$JS.{{domain}}.API.CONSUMER.INFO.KV_GLOBAL_PRESENCE.>",
                         "$JS.{{domain}}.API.CONSUMER.DELETE.KV_GLOBAL_PRESENCE.>",
                         "$JS.ACK.>" ] }
    subscribe { allow: [ "global.{{cluster}}.>", "global.director.>", "_INBOX.>" ] }
  } }
