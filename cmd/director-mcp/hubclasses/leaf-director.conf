# leaf-director: the leaf of the cluster whose broker also carries the director seat
# (one per deployment). It is the leaf grant plus the director-side grants of the
# design's grant table. Parameter: cluster.
{ nkey: {{key}}
  permissions {
    publish   { allow: [ "global.director.inbox", "global.*.supervisor.inbox", "global.director.>", "global.{{cluster}}.>",
                         "$JS.global.API.CONSUMER.CREATE.GLOBAL_TO_{{cluster}}.>",
                         "$JS.global.API.CONSUMER.DURABLE.CREATE.GLOBAL_TO_{{cluster}}.>",
                         "$JS.global.API.CONSUMER.INFO.GLOBAL_TO_{{cluster}}.>",
                         "$JS.global.API.CONSUMER.MSG.NEXT.GLOBAL_TO_{{cluster}}.>",
                         "$JS.global.API.CONSUMER.DELETE.GLOBAL_TO_{{cluster}}.>",
                         "$JS.global.API.STREAM.INFO.GLOBAL_TO_{{cluster}}",
                         "$JS.global.API.STREAM.MSG.DELETE.GLOBAL_TO_{{cluster}}",
                         "$JS.global.API.CONSUMER.CREATE.GLOBAL_TO_DIRECTOR.>",
                         "$JS.global.API.CONSUMER.DURABLE.CREATE.GLOBAL_TO_DIRECTOR.>",
                         "$JS.global.API.CONSUMER.INFO.GLOBAL_TO_DIRECTOR.>",
                         "$JS.global.API.CONSUMER.MSG.NEXT.GLOBAL_TO_DIRECTOR.>",
                         "$JS.global.API.CONSUMER.DELETE.GLOBAL_TO_DIRECTOR.>",
                         "$JS.global.API.STREAM.INFO.GLOBAL_TO_DIRECTOR",
                         "$JS.global.API.STREAM.MSG.DELETE.GLOBAL_TO_DIRECTOR",
                         "$JS.global.API.INFO",
                         "$JS.global.API.$KV.GLOBAL_PRESENCE.>",
                         "$JS.global.API.STREAM.INFO.KV_GLOBAL_PRESENCE",
                         "$JS.global.API.DIRECT.GET.KV_GLOBAL_PRESENCE.>",
                         "$JS.global.API.STREAM.MSG.GET.KV_GLOBAL_PRESENCE",
                         "$JS.global.API.CONSUMER.CREATE.KV_GLOBAL_PRESENCE.>",
                         "$JS.global.API.CONSUMER.INFO.KV_GLOBAL_PRESENCE.>",
                         "$JS.global.API.CONSUMER.DELETE.KV_GLOBAL_PRESENCE.>",
                         "$JS.ACK.>" ] }
    subscribe { allow: [ "global.{{cluster}}.>", "global.director.>", "_INBOX.>" ] }
  } }
