# director: a client credential, the director seat connecting to the hub directly. Its
# JetStream grants are spelled $JS.API because the server maps the domain prefix before it
# checks a client connection.
{ nkey: {{key}}
  permissions {
    publish   { allow: [ "global.*.supervisor.inbox", "global.director.>",
                         "$JS.API.>", "$JS.ACK.>", "$KV.GLOBAL_PRESENCE.>", "_INBOX.>" ] }
    subscribe { allow: [ "global.director.>", "$KV.GLOBAL_PRESENCE.>", "_INBOX.>" ] }
  } }
